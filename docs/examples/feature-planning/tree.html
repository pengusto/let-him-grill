  <script>
    (() => {
      const state = {"version": 2, "title": "Feature planning: saved filters", "nodes": [{"id": "audience", "question": "Who should receive saved filters first?", "context": "The first audience determines onboarding, defaults, and delivery scope.", "type": "review", "options": [{"id": "existing-users", "label": "Existing dashboard users", "assessment": {"triage": "recommended", "reason": "Existing usage provides the fastest feedback loop.", "confidence": 0.92, "reversible": true, "effort": "low", "risk": "low", "impact": "Keeps onboarding and migration small.", "preferredWhen": "The goal is fast validation with known users."}}, {"id": "new-users", "label": "New users", "assessment": {"triage": "solid-alternative", "reason": "A clean onboarding flow can teach the feature from the start.", "confidence": 0.82, "reversible": true, "effort": "medium", "risk": "medium", "impact": "Adds onboarding and empty-state work.", "preferredWhen": "Acquisition is more important than retention."}}], "choice": "existing-users", "reason": "Known users provide evidence with the smallest delivery surface.", "confidence": 0.92, "reversible": true, "dependsOn": [], "status": "recommended", "actor": "ai"}, {"id": "delivery", "question": "What is the smallest useful delivery slice?", "context": "The first release should test repeated filter use without building a full sharing system.", "type": "auto", "options": [{"id": "private-slice", "label": "Private save, rename, and delete", "assessment": {"triage": "recommended", "reason": "It tests the core repeat-use behavior without permissions.", "confidence": 0.95, "reversible": true, "effort": "low", "risk": "low", "impact": "Defers sharing and collaboration.", "preferredWhen": "Existing users need personal workflow speed."}}, {"id": "shared-library", "label": "Shared team library", "assessment": {"triage": "situational", "reason": "Sharing adds ownership and permission decisions too early.", "confidence": 0.88, "reversible": true, "effort": "high", "risk": "medium", "impact": "Creates collaboration and authorization scope.", "preferredWhen": "Team reuse is already proven as the primary need."}}], "choice": "private-slice", "reason": "One private vertical slice tests the feature promise safely.", "confidence": 0.95, "reversible": true, "dependsOn": ["audience"], "status": "recommended", "actor": "ai"}, {"id": "documentation", "question": "How should the first release be explained?", "context": "Users need one discoverable explanation independent of rollout scope.", "type": "auto", "options": [{"id": "inline-help", "label": "Inline help plus one README example", "assessment": {"triage": "recommended", "reason": "It explains the workflow at the point of use.", "confidence": 0.93, "reversible": true, "effort": "low", "risk": "low", "impact": "Adds a small maintained example.", "preferredWhen": "The interaction is simple and self-contained."}}], "choice": "inline-help", "reason": "The smallest durable explanation is sufficient.", "confidence": 0.93, "reversible": true, "dependsOn": [], "status": "recommended", "actor": "ai"}, {"id": "scope-gate", "question": "Should shared team filters be part of the first public release?", "context": "Sharing changes permissions, ownership, migration, and the public product promise.", "type": "human", "options": [{"id": "private-first", "label": "Release private filters first", "assessment": {"triage": "recommended", "reason": "It validates repeat use before adding collaboration.", "confidence": 0.9, "reversible": true, "effort": "low", "risk": "low", "impact": "Team sharing remains a follow-up.", "preferredWhen": "Fast evidence matters more than breadth."}}, {"id": "include-sharing", "label": "Include team sharing", "assessment": {"triage": "solid-alternative", "reason": "It delivers broader value but creates permission scope.", "confidence": 0.78, "reversible": false, "effort": "high", "risk": "medium", "impact": "Adds ownership, roles, and migration obligations.", "preferredWhen": "Team collaboration is a committed launch requirement."}}], "choice": null, "reason": null, "confidence": null, "reversible": false, "dependsOn": ["audience", "delivery"], "status": "pending", "actor": null}]};
      const statePath = "docs/examples/feature-planning/decisions.json";
      const root = document.getElementById("grill-decision-tree");
      const tree = root.querySelector("[data-tree]");
      const apply = root.querySelector("[data-apply]");
      const feedback = root.querySelector("[data-feedback]");
      const copyPrompt = root.querySelector("[data-copy-prompt]");
      const statusLabels = { auto:"AI recommendation", review:"Review", human:"Decision required", derived:"Derived", blocked:"Blocked" };
      const statusColors = { auto:"var(--viz-series-1, #62aef7)", review:"var(--viz-series-2, #ff9a52)", human:"var(--destructive, #ff6868)", derived:"var(--muted-foreground, #a0a0a0)", blocked:"var(--destructive, #ff6868)" };
      const triageLabels = { recommended:"Recommended", "solid-alternative":"Solid alternative", situational:"Situational", "not-recommended":"Not recommended", excluded:"Excluded · unavailable" };
      const triageColors = { recommended:"var(--gwd-positive-color)", "solid-alternative":"var(--gwd-info-color)", situational:"var(--gwd-warning-color)", "not-recommended":"var(--destructive, #ff6868)", excluded:"var(--muted-foreground, #a0a0a0)" };
      const selections = new Map();
      let fallbackPrompt = "";

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      function choiceLabel(node) {
        return node.options.find((option) => option.id === node.choice)?.label || "No selection yet";
      }
      function nodeStatusLabel(node) {
        if (node.status === "invalidated") return "Needs reassessment";
        if (node.status === "confirmed") return "Confirmed";
        return statusLabels[node.type];
      }
      function metric(text, tone, title) {
        const item = element("span", `gwd-metric gwd-${tone}`, text);
        if (title) item.title = title;
        return item;
      }
      function confidenceMetric(confidence) {
        const percent = Math.round(confidence * 100);
        if (percent >= 90) return metric(`Confidence ${percent}% · high`, "positive", "High confidence: 90–100%");
        if (percent >= 70) return metric(`Confidence ${percent}% · medium`, "warning", "Medium confidence: 70–89%");
        return metric(`Confidence ${percent}% · low`, "confidence-low", "Low confidence: below 70%");
      }
      function markPending(nodeId, target) {
        const card = [...root.querySelectorAll("[data-node-card]")].find((item) => item.dataset.nodeCard === nodeId);
        card?.querySelectorAll("[data-pending]").forEach((item) => item.hidden = item !== target);
      }
      function syncApplyState() {
        const count = selections.size;
        apply.disabled = count === 0;
        apply.textContent = "Send all decisions to Codex";
        feedback.textContent = count ? `${count} decision${count === 1 ? "" : "s"} ready` : "No pending change.";
      }
      function setSelection(node, selection, pending) {
        if (selection) selections.set(node.id, selection);
        else selections.delete(node.id);
        markPending(node.id, pending);
        syncApplyState();
      }
      function showSelection(node, answer) {
        copyPrompt.hidden = true;
        fallbackPrompt = "";
        const count = selections.size;
        feedback.textContent = `${count} decision${count === 1 ? "" : "s"} ready · Latest: ${node.question} → ${answer}`;
        feedback.title = feedback.textContent;
      }
      function renderOption(node, option) {
        const assessment = option.assessment;
        const invalidated = assessment.status === "invalidated";
        const excluded = assessment.triage === "excluded";
        const row = element("div", "gwd-option");
        const input = element("input");
        const controlId = `gwd-${node.id}-${option.id}`;
        input.id = controlId;
        input.type = "radio";
        input.name = `gwd-${node.id}`;
        input.dataset.node = node.id;
        input.dataset.option = option.id;

        const optionMain = element("div", "gwd-option-main");
        const label = element("label", "gwd-option-title", option.label);
        label.htmlFor = controlId;
        const summary = element("span", "gwd-option-summary gwd-muted", option.description || assessment.reason);
        const triage = element("span", "gwd-option-triage");
        const optionDot = element("span", "gwd-option-dot");
        optionDot.setAttribute("aria-hidden", "true");
        optionDot.style.setProperty("--gwd-option-color", invalidated ? "var(--muted-foreground, #a0a0a0)" : triageColors[assessment.triage]);

      async function sendToCodex(prompt, title, successMessage) {
        copyPrompt.hidden = true;
        fallbackPrompt = "";
        if (window.openai?.sendFollowUpMessage) {
          try {
            const result = await window.openai.sendFollowUpMessage({ prompt, title });
            if (result?.isError) throw new Error("Codex rejected the follow-up message.");
            feedback.textContent = successMessage;
          } catch {
            fallbackPrompt = prompt;
            copyPrompt.hidden = false;
            feedback.textContent = "Codex connection failed.";
          }
        } else {
          fallbackPrompt = prompt;
          copyPrompt.hidden = false;
          feedback.textContent = "Codex connection failed.";
        }
      }

      copyPrompt.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(fallbackPrompt);
          feedback.textContent = "Prompt copied.";
        } catch {
          feedback.textContent = "Could not copy prompt.";
        }
      });

      root.querySelector("[data-title]").textContent = state.title || "Decision path";
      const autonomous = state.nodes.filter((node) => node.type !== "human" && node.choice).length;
      const humanGates = state.nodes.filter((node) => node.type === "human").length;
      root.querySelector("[data-count]").textContent = `${state.nodes.length} decisions · ${autonomous} autonomous · ${humanGates} human ${humanGates === 1 ? "gate" : "gates"}`;
      if (state.nodes.length) state.nodes.forEach((node) => tree.append(renderNode(node)));
      else tree.append(element("p", "gwd-muted", "No decisions yet."));

      const firstInvalidated = state.nodes.find((node) => node.status === "invalidated");
      if (firstInvalidated) {
        const reassess = element("button", "gwd-button", "Reassess path");
        reassess.type = "button";
        reassess.dataset.reassess = firstInvalidated.id;
        reassess.addEventListener("click", async () => {
          const prompt = `Use $let-him-grill. Reassess invalidated decision node ${firstInvalidated.id} and its invalidated descendants in ${statePath}, continue to the next human gate, and render the updated tree.`;
          await sendToCodex(prompt, "Reassess path", "Reassessment sent to Codex.");
        });
        root.querySelector("[data-reassess-slot]").append(reassess);
      }
      root.querySelector("[data-expand-all]").addEventListener("click", () => {
        root.querySelectorAll("details").forEach((details) => details.open = true);
        root.querySelectorAll("[data-option-toggle]").forEach((toggle) => toggle.setAttribute("aria-expanded", "true"));
        root.querySelectorAll("[data-option-description]").forEach((description) => description.hidden = false);
      });
      root.querySelector("[data-collapse-all]").addEventListener("click", () => {
        root.querySelectorAll("details").forEach((details) => details.open = false);
        root.querySelectorAll("[data-option-toggle]").forEach((toggle) => toggle.setAttribute("aria-expanded", "false"));
        root.querySelectorAll("[data-option-description]").forEach((description) => description.hidden = true);
      });
      apply.addEventListener("click", async () => {
        if (!selections.size) return;
        const selectedItems = state.nodes.flatMap((node) => {
          const selection = selections.get(node.id);
          return selection ? [{ node, selection }] : [];
        });
        const decisions = selectedItems.map(({ node, selection }) => {
          if (selection.custom) return { node:node.id, question:node.question, customAnswer:selection.custom };
          const option = node.options.find((item) => item.id === selection.option);
          return { node:node.id, question:node.question, option:option.id, answer:option.label };
        });
        const prompt = `Use $let-him-grill. Apply these human decisions to ${statePath} in the listed state-node order: ${JSON.stringify(decisions)}. Rewrite customAnswer entries as concise decision statements without changing their meaning and assess them consistently with the existing options. After each decision, reassess descendants invalidated by earlier decisions. Apply a later listed decision only if fresh reassessment keeps it valid and selectable; otherwise stop at the first conflict and explain it. Continue to the next human gate and render the updated tree.`;
        const decisionCount = `${decisions.length} decision${decisions.length === 1 ? "" : "s"}`;
        await sendToCodex(prompt, `Apply ${decisionCount}`, `${decisionCount} sent to Codex.`);
      });
    })();
  </script>
</div>
